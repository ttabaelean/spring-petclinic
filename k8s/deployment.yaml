apiVersion: apps/v1
kind: Deployment
metadata:
  name: petclinic
spec:
  replicas: 2                       # PetClinic Pod 2개 유지
  selector:
    matchLabels:
      app: petclinic
  template:
    metadata:
      labels:
        app: petclinic
    spec:
      containers:
        - name: petclinic
          image: 884002395647.dkr.ecr.ap-northeast-2.amazonaws.com/user20-cluster-repo:f3742d3f8230d743a2a30fdb6f7edf7e7b3a966f
          ports:
            - containerPort: 8080   # Spring Boot 기본 포트
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits:   { memory: 1Gi }
          readinessProbe:           # 준비된 Pod에만 트래픽 전달
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 5
